<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02599C" />
      <stop offset="60%" stop-color="#2884C9" />
      <stop offset="100%" stop-color="#A2DDFF" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F3FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#80C7F5" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01385F" />
      <stop offset="100%" stop-color="#02599C" />
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="600" height="360" fill="url(#skyGrad)" />
  
  <!-- Modern IT Towers Silhouette -->
  <rect x="40" y="110" width="70" height="250" fill="#01385F" opacity="0.7" rx="3" />
  <rect x="130" y="70" width="90" height="290" fill="url(#glassGrad)" rx="4" />
  <!-- Glass Window Grid -->
  <g fill="#FFFFFF" opacity="0.6">
    <rect x="145" y="90" width="15" height="10" />
    <rect x="170" y="90" width="15" height="10" />
    <rect x="195" y="90" width="15" height="10" />
    <rect x="145" y="115" width="15" height="10" />
    <rect x="170" y="115" width="15" height="10" />
    <rect x="195" y="115" width="15" height="10" />
    <rect x="145" y="140" width="15" height="10" />
    <rect x="170" y="140" width="15" height="10" />
    <rect x="195" y="140" width="15" height="10" />
    <rect x="145" y="165" width="15" height="10" />
    <rect x="170" y="165" width="15" height="10" />
    <rect x="195" y="165" width="15" height="10" />
  </g>

  <rect x="240" y="130" width="60" height="230" fill="#01385F" opacity="0.85" rx="3" />
  <rect x="320" y="95" width="85" height="265" fill="url(#glassGrad)" rx="4" />
  
  <!-- Charminar Iconic Silhouette Outline in Background -->
  <g fill="#012540" opacity="0.4">
    <rect x="440" y="140" width="110" height="220" rx="4" />
    <rect x="430" y="90" width="22" height="130" rx="2" />
    <rect x="538" y="90" width="22" height="130" rx="2" />
    <path d="M480 180 A 15 25 0 0 1 510 180 Z" fill="#A2DDFF" />
  </g>

  <!-- Elevated Metro Viaduct & Train -->
  <rect x="0" y="240" width="600" height="18" fill="url(#trackGrad)" />
  <!-- Pillars -->
  <rect x="90" y="258" width="22" height="102" fill="#012540" />
  <rect x="270" y="258" width="22" height="102" fill="#012540" />
  <rect x="460" y="258" width="22" height="102" fill="#012540" />
  
  <!-- Sleek Metro Train -->
  <g transform="translate(160, 205)">
    <path d="M0 25 L15 5 L240 5 L250 25 L250 35 L0 35 Z" fill="#FFFFFF" />
    <rect x="10" y="10" width="230" height="8" fill="#E01E1E" />
    <rect x="20" y="20" width="30" height="12" fill="#01385F" rx="2" />
    <rect x="60" y="20" width="35" height="12" fill="#01385F" rx="2" />
    <rect x="105" y="20" width="35" height="12" fill="#01385F" rx="2" />
    <rect x="150" y="20" width="35" height="12" fill="#01385F" rx="2" />
    <rect x="195" y="20" width="35" height="12" fill="#01385F" rx="2" />
  </g>

  <!-- Ground Overlay Banner -->
  <rect x="0" y="325" width="600" height="35" fill="#012540" opacity="0.9" />
  <text x="20" y="348" font-family="'Noto Sans Telugu', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">తెలంగాణ సమగ్ర అభివృద్ధి • హైదరాబాదు మెట్రో &amp; ఐటీ హబ్</text>
</svg>
